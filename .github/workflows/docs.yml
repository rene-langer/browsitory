name: Docs

# Builds the user guide site (mkdocs.yml, docs/guide/) on pull requests that touch it, and
# builds and publishes it to GitHub Pages on pushes to main: https://rene-langer.github.io/browsitory/
# `strict: true` in mkdocs.yml makes a broken link, a missing page or a page left out of the
# nav fail the build. Publishing needs Pages enabled with "GitHub Actions" as the source
# (Settings → Pages); until then the deploy job fails and the build job still checks the site.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push to main replaces a queued one.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Same as docs/requirements.txt's pip-compile header.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install MkDocs (pinned, with hashes)
        run: |
          python -m venv .venv
          .venv/bin/pip install --require-hashes --no-deps -r docs/requirements.txt
      - name: Build the site
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: .venv/bin/mkdocs build --strict
      - name: Upload the site for Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
