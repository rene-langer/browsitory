name: Release

# Tags of the form release/MAJOR.MINOR.PATCH (semantic versioning, no `v` prefix — see
# docs/RELEASING.md) build standalone distributables for Linux/macOS/Windows and
# publish them as a GitHub Release.
#
# A manual run (workflow_dispatch) is always a dry run: it only checks the publishing
# credentials in the `marketplace` environment (the dry-run-* jobs at the end). Every other job
# runs for a tag push only, so a manual run builds, releases and publishes nothing. See
# docs/RELEASING.md's "Dry run".
on:
  push:
    tags:
      - "release/*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: check the publishing credentials, publish nothing (the only mode a manual run supports)"
        type: boolean
        required: true
        default: true

permissions:
  contents: write

env:
  # The VSCode extension's release channel. "false" (since 0.3.1) packages and publishes every
  # release tag as a stable release on the Visual Studio Marketplace and Open VSX; "true" would
  # publish pre-releases. (`vsce publish --pre-release` refuses a package that wasn't also
  # packaged with `--pre-release`, so build-vsix-release and publish-vsix-marketplace read it.)
  VSIX_PRE_RELEASE: "false"
  # Set by the dtolnay/rust-toolchain action these jobs used before rust-toolchain.toml pinned
  # the version (#220): no incremental builds (CI builds once; rust-cache skips them anyway) and
  # colored cargo output in the logs.
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  # Fast sanity gate before spending 3 platforms' worth of build time. Full cross-platform
  # test/clippy coverage already ran in ci.yml when this commit landed on main; this just
  # guards against tagging a commit that was never actually pushed through CI.
  verify:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Observed up to 9 min (uncached cargo test), plus up to 15 min for the apt step's retries
    # past a slow mirror (#353, #459).
    timeout-minutes: 45
    env:
      # Same pin as ci.yml's `licenses` job; keep both in sync (Renovate updates both).
      # renovate: datasource=crate depName=cargo-about
      CARGO_ABOUT_VERSION: 0.9.3
    steps:
      - uses: actions/checkout@v7
      - name: Validate tag is strict semver (release/MAJOR.MINOR.PATCH)
        run: |
          version="${GITHUB_REF_NAME#release/}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: tag '$GITHUB_REF_NAME' is not release/MAJOR.MINOR.PATCH" >&2
            exit 1
          fi
      - name: No unfolded changelog fragments
        # Every VSIX ships CHANGELOG.md, so all changelog.d/ fragments must be folded
        # into it before tagging (scripts/fold-changelog.py; see docs/RELEASING.md).
        run: python3 scripts/fold-changelog.py --check
      - name: Install Tauri system dependencies (Linux)
        # Same script and packages as ci.yml's build-dist (#459): bounded download retries that
        # skip a slow mirror (#353), at most about 11 min for the downloads plus the install
        # from the cache; see the script's "Time budget".
        timeout-minutes: 15
        run: |
          scripts/ci-apt-install.sh libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libxdo-dev build-essential
      # The version rust-toolchain.toml pins (#220), with its components.
      - name: Install Rust
        run: rustup toolchain install
      - run: cargo test --workspace
      - uses: pnpm/action-setup@v6
        with:
          # pnpm runs each project with the exact version its package.json pins (see ci.yml's
          # `licenses` job).
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            extension/pnpm-lock.yaml
      - working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm test -- --run
      # A tag on a commit that never went through main's CI must not ship stale notices
      # (THIRD_PARTY_NOTICES.md, #301). Same check as ci.yml's `licenses` job.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@${{ env.CARGO_ABOUT_VERSION }}
      - run: pnpm --dir extension install --frozen-lockfile --ignore-scripts
      - name: THIRD_PARTY_NOTICES.md is current
        run: python3 scripts/generate-third-party-notices.py --check

  build-release:
    needs: verify
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned, not ubuntu-latest (#386): the AppImage, .deb and .rpm need at least the glibc
          # of the image they are built on (2.39 on Ubuntu 24.04), so building on a newer image
          # would drop the distributions in between. Move it on purpose, together with
          # build-vsix-release below, ci.yml's build-dist and build-vsix, and
          # docs/guide/install.md.
          - os: ubuntu-24.04
            args: ""
          - os: macos-latest
            # Universal binary (arm64 + x86_64) in one .dmg.
            args: "--target universal-apple-darwin"
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    # Observed up to 16 min (macOS universal build, no cache), plus up to 15 min for the apt
    # step's retries past a slow mirror on Linux (#353, #459).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Set package version from tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#release/}"
          node -e "
            const fs = require('fs');
            const p = 'crates/tauri-app/tauri.conf.json';
            const c = JSON.parse(fs.readFileSync(p, 'utf8'));
            c.version = '${version}';
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + '\n');
          "
      - name: Install Tauri system dependencies (Linux)
        if: matrix.os == 'ubuntu-24.04'
        # Same script and packages as ci.yml's build-dist (#459): bounded download retries that
        # skip a slow mirror (#353), at most about 11 min for the downloads plus the install
        # from the cache; see the script's "Time budget".
        timeout-minutes: 15
        run: |
          scripts/ci-apt-install.sh libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libxdo-dev build-essential
      # The version rust-toolchain.toml pins (#220), with its components.
      - name: Install Rust
        env:
          TARGETS: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
        shell: bash
        run: |
          rustup toolchain install
          for target in ${TARGETS//,/ }; do rustup target add "$target"; done
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      # tauri-action looks for @tauri-apps/cli in a package.json in projectPath; crates/tauri-app
      # has none, so without tauriScript it would `npm install -g` the newest 2.x (#397).
      # tauriScript runs the CLI that frontend/pnpm-lock.yaml locks instead, with node, so it
      # still runs in projectPath (tauri-action splits tauriScript on spaces, so the path must
      # have none).
      - name: Show the locked Tauri CLI version
        working-directory: crates/tauri-app
        run: node ../../frontend/node_modules/@tauri-apps/cli/tauri.js --version
      # The bundler's tools (WiX and NSIS on Windows, the AppImage tools on Linux) come from the
      # cache that ci.yml's build-dist fills on main, keyed on the locked CLI version; whatever
      # is missing is downloaded with retries here, so a GitHub 504 doesn't fail the bundling
      # (#454). Same three steps as build-dist; see docs/RELEASING.md, "Bundler tools".
      - id: bundler-tools
        name: Find the bundler's tools folder
        if: runner.os != 'macOS'
        shell: bash
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} scripts/prefetch-bundler-tools.py --github-output --no-download
      - uses: actions/cache@v6
        if: runner.os != 'macOS'
        with:
          path: ${{ steps.bundler-tools.outputs.tools-dir }}
          key: tauri-bundler-tools-${{ runner.os }}-cli-${{ steps.bundler-tools.outputs.cli-version }}
      - name: Download the bundler's tools (with retries)
        if: runner.os != 'macOS'
        timeout-minutes: 15
        shell: bash
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} scripts/prefetch-bundler-tools.py
      # Creates the draft release (the first matrix job to finish creates it, the others find it)
      # and uploads the bundles and latest.json, the manifest every installed app's updater reads.
      # v1 (#363) differs from v0 in ways docs/RELEASING.md's "Updater manifest" describes:
      # latest.json links each bundle by its API asset URL
      # (https://api.github.com/repos/<owner>/<repo>/releases/assets/<id>), and the macOS
      # .app.tar.gz carries the version in its name.
      # Pinned by commit (#399): a new tauri-action release changes latest.json for every
      # installed app, so it arrives as a Renovate PR (renovate.json) instead of through a
      # floating tag. The action tags each release twice at the same commit, `action-vX.Y.Z` and
      # `vX.Y.Z`; the comment names the latter, which Renovate reads as a version.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PKEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PKEY_PASSWORD }}
        with:
          projectPath: crates/tauri-app
          tauriScript: node ../../frontend/node_modules/@tauri-apps/cli/tauri.js
          tagName: ${{ github.ref_name }}
          releaseName: "Browsitory ${{ github.ref_name }}"
          # Starting text of the draft release (and the `notes` of latest.json); the owner adds
          # the release notes before publishing. v1 overwrites the name and body of an existing
          # release only if it is published, never of a draft; with releaseDraft: true it only
          # ever uses a draft, so a re-run keeps hand-written notes.
          releaseBody: |
            How to install and use Browsitory: https://rene-langer.github.io/browsitory/
            What changed: https://github.com/rene-langer/browsitory/blob/${{ github.ref_name }}/CHANGELOG.md
          # Once the release is published, v1 no longer uploads into it: a re-run of this job
          # then fails (or leaves a second draft to delete). Don't re-run it after publishing.
          releaseDraft: true
          prerelease: false
          # tauri.release.conf.json only sets bundle.createUpdaterArtifacts: true — kept out of
          # the main tauri.conf.json so ci.yml's plain build-dist smoke-test job (which has no
          # signing secrets) doesn't also try to sign an updater manifest on every push to main.
          args: ${{ matrix.args }} --config tauri.release.conf.json

  build-vsix-release:
    needs: verify
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned for the same reason as build-release (#386): the linux-x64 VSIX's
          # vscode-sidecar needs at least the build image's glibc.
          - os: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            vsix_target: linux-x64
            sidecar_suffix: ""
          - os: macos-latest
            rust_target: x86_64-apple-darwin
            vsix_target: darwin-x64
            sidecar_suffix: ""
          - os: macos-15
            rust_target: aarch64-apple-darwin
            vsix_target: darwin-arm64
            sidecar_suffix: ""
          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            vsix_target: win32-x64
            sidecar_suffix: .exe
    runs-on: ${{ matrix.os }}
    # Observed up to 6 min (#353).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - id: release-version
        name: Set extension package version from tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#release/}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          node -e "
            const fs = require('fs');
            const p = 'extension/package.json';
            const c = JSON.parse(fs.readFileSync(p, 'utf8'));
            c.version = '${version}';
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + '\n');
          "
      # The version rust-toolchain.toml pins (#220), with its components.
      - name: Install Rust
        env:
          TARGETS: ${{ matrix.rust_target }}
        shell: bash
        run: |
          rustup toolchain install
          for target in ${TARGETS//,/ }; do rustup target add "$target"; done
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            extension/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend run generate:release-notes
      - run: pnpm --dir frontend exec vite build --config vite.vscode.config.ts
      - run: pnpm --dir extension install --frozen-lockfile
      - run: pnpm --dir extension run compile
      - run: cargo build --release -p vscode-sidecar --target ${{ matrix.rust_target }}
      - run: >-
          pnpm --dir extension run package:vsix -- --target ${{ matrix.vsix_target }}
          --sidecar target/${{ matrix.rust_target }}/release/vscode-sidecar${{ matrix.sidecar_suffix }}
          --out artifacts/browsitory-${{ steps.release-version.outputs.version }}-${{ matrix.vsix_target }}.vsix
          ${{ env.VSIX_PRE_RELEASE == 'true' && '--pre-release' || '' }}
      # Identity, version, pre-release flag, listing metadata and file list, before anything
      # is published (extension/scripts/check-vsix.mjs).
      - name: Check the package
        run: >-
          pnpm --dir extension run check:vsix -- --target ${{ matrix.vsix_target }}
          --version ${{ steps.release-version.outputs.version }}
          ${{ env.VSIX_PRE_RELEASE == 'true' && '--pre-release' || '' }}
          artifacts/browsitory-${{ steps.release-version.outputs.version }}-${{ matrix.vsix_target }}.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: browsitory-vsix-${{ matrix.vsix_target }}
          path: extension/artifacts/browsitory-${{ steps.release-version.outputs.version }}-${{ matrix.vsix_target }}.vsix

  publish-vsix-release:
    needs: [build-release, build-vsix-release]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Observed under 1 min: downloads the packages, uploads them to the draft release (#353).
    timeout-minutes: 15
    steps:
      # For THIRD_PARTY_NOTICES.md: every installer and .vsix already carries it; the release
      # page gets a copy too, so the licences can be read without installing anything. And for
      # the manifest check below.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            THIRD_PARTY_NOTICES.md
            scripts/check-updater-manifest.py
          sparse-checkout-cone-mode: false
      # All build-release jobs are done, so latest.json is final. Each of them rewrites it, and
      # two finishing at the same moment can lose a platform (#398). Fails before the
      # marketplace jobs run, while the release is still a draft; see docs/RELEASING.md's
      # "Updater manifest" for what it checks and what to do when it fails.
      - name: Check the updater manifest (latest.json)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dir="$RUNNER_TEMP/updater-manifest"
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -D "$dir" \
            -p latest.json -p '*.sig'
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --json assets \
            > "$dir/assets.json"
          python3 -I scripts/check-updater-manifest.py --version "${GITHUB_REF_NAME#release/}" \
            --repo "$GITHUB_REPOSITORY" --assets "$dir/assets.json" "$dir"
      - uses: actions/download-artifact@v8
        with:
          pattern: browsitory-vsix-*
          merge-multiple: true
          path: release-vsix
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            release-vsix/*.vsix
            THIRD_PARTY_NOTICES.md

  # Publishes the four platform packages to the Visual Studio Marketplace, after the desktop
  # build and the draft GitHub Release succeeded. Signs in with Microsoft Entra ID through GitHub
  # OIDC (no long-lived token): the `marketplace` environment's federated credential lets
  # azure/login sign in as the Entra app, and `vsce --azure-credential` uses that az CLI session.
  # The secrets are `marketplace` environment secrets. Skips with a notice while AZURE_CLIENT_ID
  # is unset. --skip-duplicate only makes re-running the SAME commit safe: never re-tag a
  # published version at a different commit. VSIX_PRE_RELEASE (top of this file) picks the
  # channel.
  publish-vsix-marketplace:
    needs: publish-vsix-release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/release/')
    runs-on: ubuntu-latest
    # Two listing checks of up to 30 min each (--timeout 1800 below), four vsce publishes and
    # setup (#353).
    timeout-minutes: 90
    environment: marketplace
    # One group per registry: a second job in the same group would wait, and a third would
    # cancel the waiting one.
    concurrency:
      group: marketplace-publish-vsce
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      HAS_AZURE: ${{ secrets.AZURE_CLIENT_ID != '' }}
    steps:
      - name: Skip notice
        if: env.HAS_AZURE != 'true'
        run: echo "::notice::AZURE_CLIENT_ID is not set in the marketplace environment; skipping the Visual Studio Marketplace."
      - uses: actions/checkout@v7
        if: env.HAS_AZURE == 'true'
      - uses: pnpm/action-setup@v6
        if: env.HAS_AZURE == 'true'
        with:
          version: 12
      - uses: actions/setup-node@v7
        if: env.HAS_AZURE == 'true'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml
      # vsce is extension/'s pinned dev dependency (exact version, lockfile), the same one that
      # packaged the .vsix files; --azure-credential needs vsce 2.26.1 or newer. Installed with
      # --ignore-scripts and before signing in, so no install script runs with the Azure session.
      - run: pnpm --dir extension install --frozen-lockfile --ignore-scripts
        if: env.HAS_AZURE == 'true'
      - uses: actions/download-artifact@v8
        if: env.HAS_AZURE == 'true'
        with:
          pattern: browsitory-vsix-*
          merge-multiple: true
          path: release-vsix
      - name: Check all four platform packages are present
        if: env.HAS_AZURE == 'true'
        shell: bash
        run: |
          shopt -s nullglob
          packages=(release-vsix/*.vsix)
          if [ "${#packages[@]}" -ne 4 ]; then
            echo "::error::expected 4 .vsix packages, found ${#packages[@]}: ${packages[*]}"
            exit 1
          fi
      - uses: azure/login@v3
        if: env.HAS_AZURE == 'true'
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      # The Entra app's Marketplace profile id is not a secret. The owner adds it to publisher
      # `browsitory` as a Contributor once (see docs/RELEASING.md's "Publishing the extension").
      - name: Show the Entra app's Marketplace member id
        if: env.HAS_AZURE == 'true'
        shell: bash
        run: |
          id="$(az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 --query id -o tsv)"
          echo "::notice::Marketplace member id of the Entra app: $id. If it isn't a member yet, add this id to publisher browsitory as Contributor, then re-run this job."
      # Passes once the Entra app has any role on publisher `browsitory`, even Reader;
      # publishing needs Contributor or higher.
      - name: Check the Entra sign-in reaches the Marketplace
        if: env.HAS_AZURE == 'true'
        run: pnpm --dir extension exec vsce verify-pat browsitory --azure-credential
      # The Marketplace can answer "Published" and still drop a package (#344): in 0.3.0, the
      # three targets uploaded while the first target of the new version was being validated
      # (about 7 min) never appeared; a re-run uploaded them and they stayed. So publish one
      # target, wait until the Marketplace validated it, then publish the rest.
      # scripts/verify-marketplace-listing.py only reads the public gallery; it needs no token.
      # It runs with an empty environment (`env -i`, PATH and HOME only) and `python3 -I`, so it
      # sees neither the OIDC request token nor the Azure session's variables.
      - name: Publish to the Visual Studio Marketplace
        if: env.HAS_AZURE == 'true'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#release/}"
          flags=(--azure-credential --skip-duplicate)
          if [ "$VSIX_PRE_RELEASE" = "true" ]; then flags+=(--pre-release); fi
          packages=("$GITHUB_WORKSPACE"/release-vsix/*.vsix)
          first="${packages[0]}"
          first_target="$(basename "$first" .vsix)"
          first_target="${first_target#browsitory-"$version"-}"
          pnpm --dir extension exec vsce publish "${flags[@]}" --packagePath "$first"
          env -i PATH="$PATH" HOME="$HOME" python3 -I scripts/verify-marketplace-listing.py \
            --version "$version" --timeout 1800 "$first_target"
          for vsix in "${packages[@]:1}"; do
            pnpm --dir extension exec vsce publish "${flags[@]}" --packagePath "$vsix"
          done
      # Fails with the missing targets if a package was dropped. Re-running the job is safe:
      # --skip-duplicate skips the targets already published and uploads only the missing ones.
      - name: Check every platform package is on the Marketplace
        if: env.HAS_AZURE == 'true'
        run: >-
          env -i PATH="$PATH" HOME="$HOME" python3 -I scripts/verify-marketplace-listing.py
          --version "${GITHUB_REF_NAME#release/}" --timeout 1800 --packages-dir release-vsix

  # Publishes the same four packages to Open VSX (VSCodium, Cursor, Gitpod, ...), after the
  # draft GitHub Release succeeded. OVSX_PAT is a `marketplace` environment secret; it is passed
  # only to the publish step. Skips with a notice while it is unset. No id-token permission, so
  # ovsx can't fall back to OIDC trusted publishing.
  publish-vsix-open-vsx:
    needs: publish-vsix-release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/release/')
    runs-on: ubuntu-latest
    # One listing check of up to 30 min (--timeout 1800 below) plus four ovsx publishes (#353).
    timeout-minutes: 60
    environment: marketplace
    concurrency:
      group: marketplace-publish-ovsx
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      HAS_OVSX: ${{ secrets.OVSX_PAT != '' }}
    steps:
      - name: Skip notice
        if: env.HAS_OVSX != 'true'
        run: echo "::notice::OVSX_PAT is not set in the marketplace environment; skipping Open VSX."
      # Only the listing check below; nothing from the repository runs with OVSX_PAT.
      - uses: actions/checkout@v7
        if: env.HAS_OVSX == 'true'
        with:
          sparse-checkout: scripts/verify-marketplace-listing.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@v7
        if: env.HAS_OVSX == 'true'
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        if: env.HAS_OVSX == 'true'
        with:
          pattern: browsitory-vsix-*
          merge-multiple: true
          path: release-vsix
      - name: Publish to Open VSX
        if: env.HAS_OVSX == 'true'
        shell: bash
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          shopt -s nullglob
          packages=(release-vsix/*.vsix)
          if [ "${#packages[@]}" -ne 4 ]; then
            echo "::error::expected 4 .vsix packages, found ${#packages[@]}: ${packages[*]}"
            exit 1
          fi
          # ovsx (EPL-2.0) runs here only as a build-time CI tool, pinned to an exact version;
          # it is not a dependency and is not shipped (docs/LICENSE_COMPLIANCE.md). No
          # --pre-release: ovsx ignores it for a prepackaged .vsix, which already carries the
          # pre-release flag from packaging.
          for vsix in "${packages[@]}"; do
            npx --yes ovsx@1.3.0 publish --skip-duplicate --packagePath "$vsix"
          done
      # Same check as the Marketplace job (#344). Open VSX lists a package after its scan.
      - name: Check every platform package is on Open VSX
        if: env.HAS_OVSX == 'true'
        run: >-
          env -i PATH="$PATH" HOME="$HOME" python3 -I scripts/verify-marketplace-listing.py
          --registry open-vsx --version "${GITHUB_REF_NAME#release/}" --timeout 1800
          --packages-dir release-vsix

  # --- Dry run (workflow_dispatch only) ---------------------------------------------------
  # Checks the publishing credentials without building, releasing or publishing anything. The
  # `marketplace` environment allows only `release/*` refs, so dispatch it on a tag such as
  # `release/dry-run`, which matches that policy but not the `release/*.*.*` push trigger:
  #   gh workflow run release.yml --ref release/dry-run -f dry_run=true
  # It builds no packages: ci.yml's build-vsix already packages and checks all four targets on
  # every push to main, so the credentials are the only part a dry run adds.
  dry-run-guard:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # One shell check (#353).
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Allow only a dry run on a release/ tag
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" != "true" ]; then
            echo "::error::A manual run supports only dry_run=true. To release, push a release/MAJOR.MINOR.PATCH tag."
            exit 1
          fi
          case "$GITHUB_REF" in
            refs/tags/release/*) ;;
            *)
              echo "::error::Run the dry run on a release/ tag (--ref release/dry-run); the marketplace environment allows only those."
              exit 1
              ;;
          esac
          echo "::notice::Dry run on $GITHUB_REF_NAME: checks credentials only, publishes nothing."

  # Same sign-in as publish-vsix-marketplace. Prints the Entra app's Marketplace member id
  # first, so it is shown even while the app is not yet a member of the publisher.
  dry-run-marketplace:
    needs: dry-run-guard
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Observed under 1 min (#353).
    timeout-minutes: 15
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    env:
      HAS_AZURE: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' }}
    steps:
      - name: Require the Entra secrets
        if: env.HAS_AZURE != 'true'
        run: |
          echo "::error::AZURE_CLIENT_ID or AZURE_TENANT_ID is not set in the marketplace environment."
          exit 1
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml
      # Same pinned vsce as publishing, installed before signing in (see publish-vsix-marketplace).
      - run: pnpm --dir extension install --frozen-lockfile --ignore-scripts
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Show the Entra app's Marketplace member id
        shell: bash
        run: |
          id="$(az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 --query id -o tsv)"
          echo "::notice::Marketplace member id of the Entra app: $id. Add it to publisher browsitory as Contributor if it isn't a member yet."
      # Fails with a 403 until the Entra app has a role on publisher `browsitory`. Any role
      # passes, even Reader; publishing needs Contributor (see the publisher's Members page).
      - name: Check the Entra app can reach publisher browsitory
        run: pnpm --dir extension exec vsce verify-pat browsitory --azure-credential

  dry-run-open-vsx:
    needs: dry-run-guard
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Observed under 1 min (#353).
    timeout-minutes: 10
    environment: marketplace
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # ovsx reads the token from OVSX_PAT and never prints it. Same pinned version as
      # publish-vsix-open-vsx.
      - name: Check the Open VSX token can publish to namespace browsitory
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::error::OVSX_PAT is not set in the marketplace environment."
            exit 1
          fi
          npx --yes ovsx@1.3.0 verify-pat browsitory
