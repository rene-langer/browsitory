# Regenerates THIRD_PARTY_NOTICES.md on Renovate pull requests (#325). A dependency update
# changes the generated file, and ci.yml's `licenses` job fails until it is regenerated.
#
# Two jobs, so that no job both runs code from the pull request and holds a write token:
# - `generate` (read-only, no secrets) runs the generator on the Renovate branch: that runs
#   package code (cargo metadata, cargo-about, Node imports from node_modules). It uploads only
#   THIRD_PARTY_NOTICES.md, and only if it changed.
# - `push` (contents: write, actions: write) starts from a fresh checkout of the same head
#   commit, checks the uploaded file, copies it in, commits it and pushes. It runs no package
#   code. A push made with GITHUB_TOKEN starts no workflow run, so it then dispatches ci.yml on
#   the branch (workflow_dispatch is the one event GITHUB_TOKEN may start). That run checks the
#   new head commit, and its checks show on the pull request. No extra secret is needed.
#
# No loop: the bot's push starts no pull_request run, so this workflow doesn't run again, and
# a run that finds the file current commits and dispatches nothing. renovate.json lists the bot
# in `gitIgnoredAuthors`, so Renovate keeps rebasing the branch; a rebase drops the bot's
# commit, and this workflow then regenerates once more on Renovate's new commit.
name: Renovate notices

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# One run per pull request; a newer Renovate push cancels the older run.
concurrency:
  group: renovate-notices-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate:
    # Only Renovate's own pull requests from a branch in this repository, and only when Renovate
    # itself triggered the event: never forks, never other authors, never a branch outside
    # renovate/, never a push (or reopen) by someone else on a Renovate branch.
    if: >-
      github.event.pull_request.user.login == 'renovate[bot]' &&
      github.event.sender.login == 'renovate[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'renovate/')
    runs-on: ubuntu-latest
    # Same work as ci.yml's `licenses` job (about 2 minutes) minus two of the four installs (#353).
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      # The pull request's head commit, not the merge commit. This job has a read-only token
      # and no secrets.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      # The cargo-about version pinned in the branch's own ci.yml, the one its `licenses` job
      # checks with (a Renovate PR may bump it). Read from the branch, which is fine here: this
      # job can't write anything.
      - name: Read CARGO_ABOUT_VERSION from ci.yml
        run: |
          version="$(sed -n 's/^ *CARGO_ABOUT_VERSION: *\([0-9][0-9.]*\) *$/\1/p' .github/workflows/ci.yml)"
          if ! printf '%s' "$version" | grep -qxE '[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::Could not read CARGO_ABOUT_VERSION from .github/workflows/ci.yml"
            exit 1
          fi
          echo "CARGO_ABOUT_VERSION=$version" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-about@${{ env.CARGO_ABOUT_VERSION }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          # pnpm 11 runs each project with the version its package.json pins (see ci.yml's
          # `licenses` job).
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            extension/pnpm-lock.yaml
      - name: Install the shipped npm trees (no install scripts)
        run: |
          pnpm --dir frontend install --frozen-lockfile --ignore-scripts
          pnpm --dir extension install --frozen-lockfile --ignore-scripts
      - name: Regenerate THIRD_PARTY_NOTICES.md
        run: python3 scripts/generate-third-party-notices.py
      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- THIRD_PARTY_NOTICES.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "THIRD_PARTY_NOTICES.md is already current; nothing to commit." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- THIRD_PARTY_NOTICES.md
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.changes.outputs.changed == 'true'
        with:
          name: third-party-notices
          path: THIRD_PARTY_NOTICES.md
          if-no-files-found: error
          retention-days: 1

  push:
    needs: generate
    if: needs.generate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    # A checkout, one push and at most a minute waiting for the dispatched run (#353).
    timeout-minutes: 10
    permissions:
      contents: write # push the regenerated file to the Renovate branch
      actions: write # dispatch ci.yml on that branch
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # A fresh checkout of the same head commit; nothing from the `generate` job's workspace
      # but the one uploaded file reaches this job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: third-party-notices
          path: ${{ runner.temp }}/notices
      # A regular file (no symlink), under 4 MiB (the current file is about 0.4 MiB), UTF-8 text
      # without NUL bytes. Anything else stops the job.
      - name: Check the regenerated file
        env:
          NOTICES: ${{ runner.temp }}/notices/THIRD_PARTY_NOTICES.md
        run: |
          if [ ! -f "$NOTICES" ] || [ -L "$NOTICES" ]; then
            echo "::error::The artifact holds no regular THIRD_PARTY_NOTICES.md"
            exit 1
          fi
          size="$(stat -c %s "$NOTICES")"
          if [ "$size" -ge 4194304 ]; then
            echo "::error::THIRD_PARTY_NOTICES.md is $size bytes, over the 4 MiB limit"
            exit 1
          fi
          python3 -I -c 'import sys; d = open(sys.argv[1], "rb").read(); d.decode("utf-8"); sys.exit(b"\0" in d)' "$NOTICES" \
            || { echo "::error::THIRD_PARTY_NOTICES.md is not UTF-8 text"; exit 1; }
          cp -- "$NOTICES" THIRD_PARTY_NOTICES.md
      # One new commit on top of the head `generate` checked. Before pushing, the branch tip must
      # still be that head; if Renovate pushed in the meantime, stop (Renovate's push started a
      # new run). The push is never forced, so a later move is rejected as non-fast-forward.
      # The token reaches git through GIT_CONFIG_* environment variables, not the command line.
      - name: Commit and push
        id: push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if git diff --quiet -- THIRD_PARTY_NOTICES.md; then
            echo "THIRD_PARTY_NOTICES.md matches the branch already; nothing to commit." >> "$GITHUB_STEP_SUMMARY"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- THIRD_PARTY_NOTICES.md
          git commit -m "Regenerate THIRD_PARTY_NOTICES.md for this dependency update" \
            -m "Generated by the Renovate notices workflow (#325): $RUN_URL"
          auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          tip="$(git ls-remote origin "refs/heads/$HEAD_REF" | cut -f1)"
          if [ "$tip" != "$HEAD_SHA" ]; then
            echo "::notice::The branch moved on (now ${tip:-gone}, expected $HEAD_SHA); not pushing. The new commit's own run regenerates the file."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git push origin "HEAD:refs/heads/$HEAD_REF"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # The push above starts no workflow run, so start CI on the branch. The run checks the
      # branch tip at dispatch time; if Renovate pushed again in between, it checks Renovate's
      # newer commit instead (which has its own pull_request run, and this workflow runs again).
      - name: Run CI on the new commit
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUSHED_SHA: ${{ steps.push.outputs.sha }}
        run: |
          # A little earlier than now, in case the runner's clock is ahead of GitHub's.
          since="$(date -u -d '-30 seconds' +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_REF"
          run_sha=""
          for _ in $(seq 1 12); do
            sleep 5
            run_sha="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch "$HEAD_REF" \
              --event workflow_dispatch --limit 5 --json headSha,createdAt \
              --jq "[.[] | select(.createdAt >= \"$since\")][0].headSha // \"\"")"
            [ -n "$run_sha" ] && break
          done
          if [ -z "$run_sha" ]; then
            echo "::warning::Could not find the dispatched CI run within a minute; check the Actions tab."
          elif [ "$run_sha" != "$PUSHED_SHA" ]; then
            echo "::warning::The dispatched CI run checks $run_sha, not the pushed commit $PUSHED_SHA: the branch moved on. Its own pull_request run covers the newer commit."
          else
            echo "Committed the regenerated THIRD_PARTY_NOTICES.md to \`$HEAD_REF\` ($PUSHED_SHA) and started CI on it." >> "$GITHUB_STEP_SUMMARY"
          fi
