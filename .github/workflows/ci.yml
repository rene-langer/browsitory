name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Catches newly-disclosed advisories against dependencies already on main, independent of
    # any PR activity — see SEC-003 (issue #24).
    - cron: "0 6 * * 1"
  # Started by renovate-notices.yml after it commits a regenerated THIRD_PARTY_NOTICES.md to a
  # Renovate branch: that push, made with GITHUB_TOKEN, starts no run of its own (#325). Jobs
  # that read pull request context fall back to the default branch as the base (`changelog`
  # also ignores the `skip-changelog` label there); build-dist and build-vsix never run on it.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Every job has a timeout-minutes (#353), so a stuck download fails the job instead of holding
  # a runner for GitHub's 6-hour default. Each is about 2 to 3 times the job's slowest green run
  # in November 2026, not counting slow-mirror apt downloads (the apt steps have their own
  # limit), with room for a cold Rust cache. Raise one if a job legitimately grows past it.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # renovate: datasource=crate depName=cargo-audit
      CARGO_AUDIT_VERSION: 0.22.2
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@${{ env.CARGO_AUDIT_VERSION }}
      # The plain CLI, not rustsec/audit-check: that action posts its result as an extra check
      # run and often failed updating it ("Not Found - update-a-check-run"), failing this
      # required job with no advisory found (#728). `cargo audit` fails only on a vulnerability
      # not ignored in .cargo/audit.toml; unmaintained/unsound warnings are printed, not fatal.
      # A new advisory on the weekly schedule fails the run, which notifies the owner.
      - name: cargo audit
        run: cargo audit
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: pnpm audit
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --prod
      # The two doc checks below run even when an audit step above failed (#707): a newly
      # disclosed advisory, which no PR is at fault for, must not hide a missing doc entry.
      # `!cancelled()` rather than `always()`, so a cancelled run still stops here.
      - name: License compliance doc is in sync
        if: ${{ !cancelled() }}
        run: python3 scripts/check-license-compliance.py
      # Every host the app's code names is listed in the privacy notice (#627).
      - name: Privacy notice lists every hard-coded host
        if: ${{ !cancelled() }}
        run: |
          python3 scripts/test_check_privacy_hosts.py
          python3 scripts/check-privacy-hosts.py

  # Every licence in the full dependency trees, Rust and npm, against the policy in AGENTS.md
  # and docs/LICENSE_COMPLIANCE.md (#273). Advisories stay in the `audit` job above. Also checks
  # that the generated THIRD_PARTY_NOTICES.md still matches those trees (#301, #202).
  licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # renovate: datasource=crate depName=cargo-deny
      CARGO_DENY_VERSION: 0.20.2
      # renovate: datasource=crate depName=cargo-about
      CARGO_ABOUT_VERSION: 0.9.3
    steps:
      - uses: actions/checkout@v7
      - name: check-dependency-licenses.py unit tests
        run: python3 scripts/test_check_dependency_licenses.py
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@${{ env.CARGO_DENY_VERSION }},cargo-about@${{ env.CARGO_ABOUT_VERSION }}
      - name: Rust licences (cargo deny, all target platforms)
        run: cargo deny check licenses
      - uses: pnpm/action-setup@v6
        with:
          # Every `version:` input here and in the other workflows names the pnpm major only; pnpm
          # then switches to the exact version each project's package.json `packageManager` pins
          # (the same 12.x in all four projects, see docs/ARCHITECTURE.md's testing strategy).
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            extension/pnpm-lock.yaml
            e2e/pnpm-lock.yaml
            extension/e2e/pnpm-lock.yaml
      - name: Install npm trees (no install scripts)
        run: |
          pnpm --dir frontend install --frozen-lockfile --ignore-scripts
          pnpm --dir extension install --frozen-lockfile --ignore-scripts
          pnpm --dir e2e install --frozen-lockfile --ignore-scripts
          cd extension/e2e && pnpm install --frozen-lockfile --ignore-scripts --ignore-workspace
      # After the installs: one test reads frontend/node_modules/tm-grammars.
      - name: generate-third-party-notices.py unit tests
        run: python3 scripts/test_generate_third_party_notices.py
      - name: npm licences (all four projects, production and dev, all platforms)
        run: python3 scripts/check-dependency-licenses.py --summary
      # Fails when a dependency update changed the Rust or bundled npm trees, or a vendored C
      # library's -sys crate version no longer matches scripts/notices/native-libraries.md. The
      # error names the command that regenerates the file.
      - name: THIRD_PARTY_NOTICES.md is current
        run: python3 scripts/generate-third-party-notices.py --check

  changelog:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: check-changelog.py unit tests
        run: python3 scripts/test_check_changelog.py
      - name: fold-changelog.py unit tests
        run: python3 scripts/test_fold_changelog.py
      # Release tooling (release.yml's publish jobs, #344); no network, the HTTP calls are faked.
      - name: verify-marketplace-listing.py unit tests
        run: python3 scripts/test_verify_marketplace_listing.py
      # Release tooling too (release.yml's publish-vsix-release, #398); files only, no network.
      - name: check-updater-manifest.py unit tests
        run: python3 scripts/test_check_updater_manifest.py
      # Build tooling (build-dist and release.yml's build-release, #454); no network.
      - name: prefetch-bundler-tools.py unit tests
        run: python3 scripts/test_prefetch_bundler_tools.py
      # Never fails (#458): when frontend/pnpm-lock.yaml (e.g. a Renovate Tauri group PR) locks
      # another @tauri-apps/cli than the script's tool list was copied from, this adds a warning
      # annotation and a job summary line, so the PR shows that the list needs updating. See
      # docs/RELEASING.md, "Bundler tools".
      - name: Bundler tool list matches the locked Tauri CLI
        run: python3 scripts/prefetch-bundler-tools.py --check-version
      - name: Changelog entry (fragment in changelog.d/ or CHANGELOG.md)
        env:
          # A dispatched run has no pull request: the default branch is the base, and there are
          # no labels, so a `skip-changelog` label on the PR doesn't apply there. Renovate PRs
          # don't need it: dependency manifests, lockfiles and THIRD_PARTY_NOTICES.md need no
          # changelog entry.
          SKIP_CHANGELOG_CHECK: ${{ contains(github.event.pull_request.labels.*.name, 'skip-changelog') && '1' || '' }}
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        run: python3 scripts/check-changelog.py --base "origin/$BASE_REF"

  rust:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        # Bounded download retries that skip a slow mirror (#353). The script's download phases
        # take at most 3 x (45 + 10) + 3 x (150 + 10) s = about 11 min, plus the install from
        # the cache (under 1 min so far); see the script's "Time budget".
        timeout-minutes: 15
        run: |
          scripts/ci-apt-install.sh libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libxdo-dev build-essential
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Caches ~/.cargo and the dependencies in target/ (#308). The key is the job id plus the
      # rustc version and host, so each OS gets its own cache. Only main saves; PRs restore
      # main's cache and never write one, so a PR can't evict or poison it. The action sets
      # CARGO_INCREMENTAL=0 and never caches the workspace crates or incremental dirs.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      # #188: tests that use a throwaway gpg keyring must stop the gpg-agent gpg starts for it;
      # a leaked agent holds an inotify instance until the per-user limit runs out. Windows
      # skips the gpg tests entirely.
      - name: No leaked gpg-agent (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: scripts/check-gpg-agent-leaks.sh
      # Prints the case-insensitive probe's row table (#156, #167): `cargo test` above already
      # asserts nothing outside the repository changed, but captures the table. Built already,
      # so this only re-runs one test.
      - name: Case-insensitive probe table (macOS/Windows)
        if: matrix.os != 'ubuntu-latest'
        run: cargo test -p git-core --test case_insensitive_links -- --nocapture
      # The `forge-fixture-override` feature (see crates/tauri-app/Cargo.toml's doc comment)
      # gates security-sensitive code — the forge API-base-URL override and the in-memory
      # credential store swap — that only the `e2e` job below otherwise builds, and that job
      # only builds it, it never runs `cargo test`/`cargo clippy` against it. Run both here too
      # so a regression in that gated code is caught as a normal, fast `rust` job failure
      # instead of only surfacing as a confusing E2E failure.
      - name: Clippy (forge-fixture-override feature)
        run: cargo clippy -p tauri-app --features forge-fixture-override --all-targets -- -D warnings
      - name: Test (forge-fixture-override feature)
        run: cargo test -p tauri-app --features forge-fixture-override

  # Mutation testing of the code a pull request changes in git-core and repo-service: cargo-mutants
  # makes small edits to that code (return a default, flip a condition, …) and runs the package's
  # tests against each one. A "missed" mutant is a change no test noticed. Informational only:
  # the job is not a required check, and its steps never fail it (a lost runner or the job
  # timeout can still show it red). It posts its result as one sticky comment on the pull
  # request (updated on each run) and in the run summary. Mutants are only generated for
  # changed lines in `src/`, so a PR that changes only tests or other crates skips the run. A
  # dispatched run diffs against the default branch instead and posts no comment. See
  # docs/ARCHITECTURE.md's "Testing strategy".
  mutants:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Replaces the workflow's permissions: checkout needs contents, the comment pull-requests.
    permissions:
      contents: read
      pull-requests: write
    # Backstop only; the mutation step has its own, shorter limit (see there).
    timeout-minutes: 60
    env:
      # Not CARGO_*: rust-cache hashes CARGO* env vars into its key (see the rust-cache step).
      # renovate: datasource=crate depName=cargo-mutants
      MUTANTS_VERSION: 27.1.0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Diff against the pull request's base
        id: diff
        env:
          # A dispatched run has no pull request: diff against the default branch.
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          git diff "origin/$BASE_REF...HEAD" > pr.diff
          if grep -qE '^\+\+\+ b/crates/(git-core|repo-service)/src/.*\.rs$' pr.diff; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No Rust source changes in git-core or repo-service; nothing to mutate." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install system dependencies
        if: steps.diff.outputs.relevant == 'true'
        # libdbus-sys (keyring, in repo-service) builds against libdbus via pkg-config.
        # Bounded download retries that skip a slow mirror (#353). The script's download phases
        # take at most 3 x (45 + 10) + 3 x (150 + 10) s = about 11 min, plus the install from
        # the cache (under 1 min so far); see the script's "Time budget".
        timeout-minutes: 15
        run: scripts/ci-apt-install.sh libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        if: steps.diff.outputs.relevant == 'true'
      # Restores the `rust` job's Linux cache, so the baseline build only compiles the workspace
      # crates. rust-cache's restore key is `shared-key`, OS, arch and a hash of the rustc version
      # and every CARGO*/RUST*/CC*/CFLAGS*/CXX*/CMAKE* env var, so `shared-key: rust` matches
      # the `rust` job only while this job sets no env var with those prefixes (hence
      # `MUTANTS_VERSION`, not `CARGO_MUTANTS_VERSION`). Never saves: this job runs only on pull
      # requests (and dispatched runs), and `--in-place` builds mutated code that must not end up in a cache.
      - uses: Swatinem/rust-cache@v2
        if: steps.diff.outputs.relevant == 'true'
        with:
          shared-key: rust
          save-if: false
      - uses: taiki-e/install-action@v2
        if: steps.diff.outputs.relevant == 'true'
        with:
          tool: cargo-mutants@${{ env.MUTANTS_VERSION }}
      - name: Mutation testing (changed code)
        id: mutants
        if: steps.diff.outputs.relevant == 'true'
        # Uncached, the baseline build and test run alone take about 5 minutes; each mutant then
        # rebuilds incrementally and reruns the tests. The limit keeps a large diff from tying up
        # a runner for hours; a run cut off by it still counts what finished, and
        # continue-on-error keeps the job green.
        timeout-minutes: 40
        continue-on-error: true
        # Exit codes: 0 all caught, 2 some missed, 3 some timed out, 4 baseline tests failed (the
        # `rust` job reports those). None of them fail this step; the summary below reports them.
        run: |
          status=0
          cargo mutants --no-shuffle --in-place --in-diff pr.diff \
            --package git-core --package repo-service || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Summary
        if: always() && steps.diff.outputs.relevant == 'true'
        run: |
          out=mutants.out
          count() { if [ -f "$out/$1" ]; then grep -c . "$out/$1" || true; else echo 0; fi; }
          {
            echo "## Mutation testing (changed code)"
            echo
            echo "| Caught | Missed | Timed out | Unviable |"
            echo "|---|---|---|---|"
            echo "| $(count caught.txt) | $(count missed.txt) | $(count timeout.txt) | $(count unviable.txt) |"
            echo
            if [ "${{ steps.mutants.outcome }}" = "failure" ]; then
              echo "The run hit its time limit; the counts above cover only the mutants it finished."
              echo
            fi
            if [ "${{ steps.mutants.outputs.status }}" = "4" ]; then
              echo "The tests failed without any mutation, so no mutant was tested. See the \`rust\` job."
            elif [ -s "$out/missed.txt" ]; then
              echo "### Missed: no test noticed these changes"
              echo
              echo '```'
              cat "$out/missed.txt"
              echo '```'
              echo
              echo "Each line is a change to the code that every test still passed. Either a test"
              echo "is missing, or the mutated code doesn't matter (then it may be worth removing)."
            else
              echo "Every viable mutant was caught by a test."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always() && steps.diff.outputs.relevant == 'true'
        with:
          name: mutants-out
          path: mutants.out
      # One sticky comment per pull request, found by its marker and edited on re-runs. Only for
      # pull requests from this repo: a fork's GITHUB_TOKEN can't comment, and a dispatched run
      # has no pull request. A skipped mutation run creates no comment but updates an earlier
      # one. Never fails the job.
      - name: Comment on the pull request
        if: >-
          !cancelled() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RELEVANT: ${{ steps.diff.outputs.relevant }}
          OUTCOME: ${{ steps.mutants.outcome }}
          STATUS: ${{ steps.mutants.outputs.status }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          marker='<!-- mutants-report -->'
          out=mutants.out
          max=100  # lines per list; with lines cut to 200 chars the body stays far below 65536
          count() { if [ -f "$out/$1" ]; then grep -c . "$out/$1" || true; else echo 0; fi; }
          list() {  # list <file> <heading>
            [ -s "$out/$1" ] || return 0
            n=$(count "$1")
            echo "### $2 ($n)"
            echo
            echo '```'
            head -n "$max" "$out/$1" | cut -c1-200
            echo '```'
            if [ "$n" -gt "$max" ]; then
              echo
              echo "First $max of $n; the full list is in the \`mutants-out\` artifact of [the run]($RUN_URL)."
            fi
            echo
          }
          existing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$marker\"))) | .id" \
            | head -n 1)
          {
            echo "$marker"
            echo "## Mutation testing (changed code)"
            echo
            if [ "$RELEVANT" != "true" ]; then
              echo "No Rust source changes in git-core or repo-service at $HEAD_SHA; nothing to mutate."
              echo
            else
              echo "| Caught | Missed | Timed out | Unviable |"
              echo "|---|---|---|---|"
              echo "| $(count caught.txt) | $(count missed.txt) | $(count timeout.txt) | $(count unviable.txt) |"
              echo
              if [ "$OUTCOME" = "failure" ]; then
                echo "The run hit its time limit; the counts cover only the mutants it finished."
                echo
              fi
              if [ "$STATUS" = "4" ]; then
                echo "The tests failed without any mutation, so no mutant was tested. See the \`rust\` job."
                echo
              else
                list missed.txt "Missed: no test noticed these changes"
                list timeout.txt "Timed out"
                if [ ! -s "$out/missed.txt" ] && [ ! -s "$out/timeout.txt" ]; then
                  echo "Every viable mutant was caught by a test."
                  echo
                fi
              fi
              echo "To triage: for each missed mutant add a test that fails on it, or say in the PR why it is"
              echo "equivalent or harmless. Mutants in \`#[cfg(windows)]\` files are always missed on this Linux runner."
              echo
            fi
            echo "Informational, not a required check. [Run]($RUN_URL), commit $HEAD_SHA."
          } > comment.md
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -F body=@comment.md > /dev/null
            echo "Updated comment $existing."
          elif [ "$RELEVANT" = "true" ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@comment.md > /dev/null
            echo "Created a comment."
          else
            echo "Nothing to mutate and no earlier comment; not commenting."
          fi

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test -- --run

  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Own cache (job-id key): this job builds only the dev vscode-sidecar. See the `rust` job.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # sidecarBridge.real.test.ts spawns the real vscode-sidecar binary and never builds it
      # (#552): locally a missing binary skips the test, under CI it fails the run. So this
      # step must stay before `pnpm test`.
      - name: Build dev sidecar
        working-directory: .
        run: cargo build -p vscode-sidecar
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test -- --run
      - run: pnpm run test:package
      - run: pnpm run compile
      - run: pnpm run lint

  # Builds standalone distributables on every push to main (not PRs) so a build is always
  # test-drivable without waiting for a release tag. Short-retention CI artifacts, distinct
  # from release.yml's tag-triggered draft GitHub Release, which is the permanent distribution
  # path.
  build-dist:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [rust, frontend, extension, e2e]
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04, not ubuntu-latest: the image release.yml's build-release builds the
        # shipped Linux bundles on (it sets their glibc floor, #386), so this job builds what the
        # release ships.
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies (Linux)
        if: matrix.os == 'ubuntu-24.04'
        # Bounded download retries that skip a slow mirror (#353). The script's download phases
        # take at most 3 x (45 + 10) + 3 x (150 + 10) s = about 11 min, plus the install from
        # the cache (under 1 min so far); see the script's "Time budget".
        timeout-minutes: 15
        run: |
          scripts/ci-apt-install.sh libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libxdo-dev build-essential
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      # Caches ~/.cargo only (the registry), not target/:
      # the release builds for three OSes would take a large share of the 10 GB repository
      # cache limit and evict the caches the PR jobs use. This job runs only on main.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      # The bundler downloads WiX and NSIS (Windows) and the AppImage tools (Linux) from GitHub
      # release downloads, each tried once; a 504 there failed this job (#454). So the tools
      # folder is cached, keyed on the locked CLI version, and whatever the cache didn't restore
      # is downloaded with retries before the build, the way the bundler would. Same three steps
      # as release.yml's build-release. macOS downloads nothing. See docs/RELEASING.md,
      # "Bundler tools".
      - id: bundler-tools
        name: Find the bundler's tools folder
        if: runner.os != 'macOS'
        shell: bash
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} scripts/prefetch-bundler-tools.py --github-output --no-download
      - uses: actions/cache@v6
        if: runner.os != 'macOS'
        with:
          path: ${{ steps.bundler-tools.outputs.tools-dir }}
          key: tauri-bundler-tools-${{ runner.os }}-cli-${{ steps.bundler-tools.outputs.cli-version }}
      - name: Download the bundler's tools (with retries)
        if: runner.os != 'macOS'
        timeout-minutes: 15
        shell: bash
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} scripts/prefetch-bundler-tools.py
      # The build-dist scripts run the @tauri-apps/cli that frontend/pnpm-lock.yaml locks, as
      # release.yml's build-release does, so this job bundles with the release's CLI (#430).
      - name: Build distributable (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: scripts/build-dist.sh ${{ matrix.os == 'macos-latest' && '--target universal-apple-darwin' || '' }}
      - name: Build distributable (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: scripts\build-dist.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: browsitory-dist-${{ matrix.os }}
          path: ${{ matrix.os == 'macos-latest' && 'target/universal-apple-darwin/release/bundle/' || 'target/release/bundle/' }}
          retention-days: 7

  # The extension needs one VSIX per native sidecar target. These short-retention artifacts let
  # main-branch CI validate the installable package without creating a GitHub Release.
  build-vsix:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [rust, frontend, extension, e2e, e2e-vscode, vsix-smoke]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Same pinned image as release.yml's build-vsix-release (#386).
          - os: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            vsix_target: linux-x64
            sidecar_suffix: ""
          - os: macos-latest
            rust_target: x86_64-apple-darwin
            vsix_target: darwin-x64
            sidecar_suffix: ""
          - os: macos-15
            rust_target: aarch64-apple-darwin
            vsix_target: darwin-arm64
            sidecar_suffix: ""
          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            vsix_target: win32-x64
            sidecar_suffix: .exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            extension/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend run generate:release-notes
      - run: pnpm --dir frontend exec vite build --config vite.vscode.config.ts
      - run: pnpm --dir extension install --frozen-lockfile
      - run: pnpm --dir extension run compile
      - run: cargo build --release -p vscode-sidecar --target ${{ matrix.rust_target }}
      - run: >-
          pnpm --dir extension run package:vsix -- --target ${{ matrix.vsix_target }}
          --sidecar target/${{ matrix.rust_target }}/release/vscode-sidecar${{ matrix.sidecar_suffix }}
          --out artifacts/browsitory-${{ github.sha }}-${{ matrix.vsix_target }}.vsix
      # Identity, version, listing metadata, file list and the target's sidecar binary
      # (extension/scripts/check-vsix.mjs). release.yml runs the same check before publishing.
      - name: Check the package
        shell: bash
        run: >-
          pnpm --dir extension run check:vsix -- --target ${{ matrix.vsix_target }}
          --version "$(node -p "require('./extension/package.json').version")"
          artifacts/browsitory-${{ github.sha }}-${{ matrix.vsix_target }}.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: browsitory-vsix-${{ matrix.vsix_target }}
          path: extension/artifacts/browsitory-${{ github.sha }}-${{ matrix.vsix_target }}.vsix
          retention-days: 7

  # Packages the linux-x64 .vsix the way build-vsix and release.yml do, checks it
  # (extension/scripts/check-vsix.mjs), then installs that package into a real VSCode with
  # `code --install-extension` and checks that it activates and that its bundled sidecar opens a
  # repository (extension/e2e's smoke:vsix). e2e-vscode instead runs this checkout in
  # development mode. Runs on every PR; build-vsix checks all four targets on main.
  vsix-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Install Xvfb
        # Bounded download retries that skip a slow mirror (#353). The script's download phases
        # take at most 3 x (45 + 10) + 3 x (150 + 10) s = about 11 min, plus the install from
        # the cache (under 1 min so far); see the script's "Time budget".
        timeout-minutes: 15
        run: scripts/ci-apt-install.sh xvfb dbus
      - uses: dtolnay/rust-toolchain@stable
      # Own cache (job-id key): only the release vscode-sidecar.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            extension/pnpm-lock.yaml
            extension/e2e/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend run generate:release-notes
      - run: pnpm --dir frontend exec vite build --config vite.vscode.config.ts
      - run: pnpm --dir extension install --frozen-lockfile
      - run: pnpm --dir extension run compile
      - run: cargo build --release -p vscode-sidecar
      # Stable, like release.yml while VSIX_PRE_RELEASE is "false" (add --pre-release to both
      # steps if it goes back to "true").
      - name: Package the linux-x64 .vsix
        run: >-
          pnpm --dir extension run package:vsix -- --target linux-x64
          --sidecar target/release/vscode-sidecar
          --out artifacts/browsitory-linux-x64.vsix
      - name: Check the package
        run: >-
          pnpm --dir extension run check:vsix -- --target linux-x64
          --version "$(node -p "require('./extension/package.json').version")"
          artifacts/browsitory-linux-x64.vsix
      - name: Install e2e dependencies
        working-directory: extension/e2e
        # --ignore-workspace: see e2e-vscode.
        run: pnpm install --frozen-lockfile --ignore-workspace
      - name: Install the package into VSCode and smoke-test it
        working-directory: extension/e2e
        run: >-
          dbus-run-session -- xvfb-run --auto-servernum
          pnpm --ignore-workspace smoke:vsix ../artifacts/browsitory-linux-x64.vsix

  e2e-vscode:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VSCODE_E2E_REPO_PATH: /tmp/browsitory-vscode-e2e-repo
    steps:
      - uses: actions/checkout@v7
      - name: Install Xvfb and Tauri system dependencies (Linux)
        # Bounded download retries that skip a slow mirror (#353). The script's download phases
        # take at most 3 x (45 + 10) + 3 x (150 + 10) s = about 11 min, plus the install from
        # the cache (under 1 min so far); see the script's "Time budget".
        timeout-minutes: 15
        run: |
          scripts/ci-apt-install.sh xvfb dbus libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libxdo-dev build-essential
      - uses: dtolnay/rust-toolchain@stable
      # Own cache (job-id key): a plain `cargo build --workspace`. See the `rust` job.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            extension/pnpm-lock.yaml
            extension/e2e/pnpm-lock.yaml
      - name: Build dev sidecar
        run: cargo build --workspace
      - name: Build vscode frontend (with E2E fixture auto-open baked in)
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run generate:release-notes
          VITE_E2E_REPO_PATH="$VSCODE_E2E_REPO_PATH" pnpm exec vite build --config vite.vscode.config.ts
      - name: Compile extension
        working-directory: extension
        run: |
          pnpm install --frozen-lockfile
          pnpm run compile
      - name: Install e2e dependencies
        working-directory: extension/e2e
        # extension/e2e isn't a member of extension/pnpm-workspace.yaml. Its own
        # pnpm-workspace.yaml (`packages: ['.']`) stops pnpm resolving upward to extension/
        # (which used to install into extension/node_modules); --ignore-workspace stays as a
        # second guard that treats extension/e2e as standalone.
        run: pnpm install --frozen-lockfile --ignore-workspace
      - name: Typecheck e2e specs
        working-directory: extension/e2e
        run: pnpm --ignore-workspace typecheck
      - name: Run VSCode E2E suite
        working-directory: extension/e2e
        # A `dconf watch /system/proxy/` helper process (GTK/GLib's proxy-resolver mechanism,
        # triggered by Electron) can squat the harness's CDP debug port; runTests.ts mitigates
        # this with GSETTINGS_BACKEND=memory, GIO_USE_PROXY_RESOLVER=dummy, a best-effort
        # `pkill -f "dconf watch"` before launch, and a dynamically chosen free port, but that
        # cleanup only runs *before* launch, not after — see docs/tasks/phase-6/d-02-vscode-e2e-harness.md.
        # GitHub-hosted ubuntu-latest runners are fresh VMs per job, so there's no leftover
        # process from a prior job to squat this run's port; this is a known limitation to keep
        # in mind if this job ever moves to a self-hosted or reused runner, not a live bug here.
        # --ignore-workspace: same reason as the install step above — extension/e2e isn't a
        # member of extension/'s workspace (before it had its own pnpm-workspace.yaml, pnpm 11
        # hard-errored "packages field missing or empty" walking up to extension/).
        run: dbus-run-session -- xvfb-run --auto-servernum pnpm --ignore-workspace test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # Fixed fixture-repo path the E2E frontend build bakes in via VITE_E2E_REPO_PATH and that
    # e2e/wdio.conf.ts's `onPrepare` hook creates before the WebDriver session starts. Must
    # match `E2E_REPO_PATH` in e2e/wdio.conf.ts (os.tmpdir() is `/tmp` on Linux runners).
    env:
      E2E_REPO_PATH: /tmp/browsitory-e2e-repo
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri + tauri-driver system dependencies (Linux)
        # Bounded download retries that skip a slow mirror (#353). The script's download phases
        # take at most 3 x (45 + 10) + 3 x (150 + 10) s = about 11 min, plus the install from
        # the cache (under 1 min so far); see the script's "Time budget".
        timeout-minutes: 15
        # WebKitWebDriver's package is webkit2gtk-driver on Ubuntu 24.04 and webkitgtk-webdriver
        # from 26.04 on (each image has only its own name), so ubuntu-latest's move to 26.04
        # needs no edit here (#386).
        run: |
          . /etc/os-release
          if dpkg --compare-versions "$VERSION_ID" gt 24.04; then
            webdriver=webkitgtk-webdriver
          else
            webdriver=webkit2gtk-driver
          fi
          scripts/ci-apt-install.sh libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libxdo-dev build-essential \
            "$webdriver" xvfb dbus
      - uses: dtolnay/rust-toolchain@stable
      # Own cache (job-id key): this build enables the custom-protocol and
      # forge-fixture-override features, so it must not share a cache with a plain build.
      # Placed before `cargo install tauri-driver` so the installed binary is cached too.
      # See the `rust` job.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install tauri-driver
        # tauri-driver's version is independent of any other Tauri versions.
        run: cargo install tauri-driver --locked
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            e2e/pnpm-lock.yaml
      - name: Build frontend (with E2E fixture auto-open baked in)
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          VITE_E2E_REPO_PATH="$E2E_REPO_PATH" pnpm build
      - name: Build tauri-app (embedded-assets production mode)
        # Plain `cargo build` leaves Tauri's `dev` cfg true (see crates/tauri-app/Cargo.toml's
        # `custom-protocol` feature comment), which would make the binary load the Vite dev
        # server instead of the just-built frontend/dist above — fatal here, since no dev
        # server is running. `--features tauri-app/custom-protocol` embeds frontend/dist instead.
        # `tauri-app/forge-fixture-override` (also opt-in, also documented on its Cargo.toml
        # feature entry) lets `e2e/specs/pull-requests.spec.ts` redirect the GitHub/Bitbucket API
        # calls to a local fixture server instead of the real hosts, and swaps the credential
        # store `Worker::spawn` constructs to an in-memory one — this runner has no session
        # D-Bus secrets service for the real OS-keychain store to talk to, and this also avoids
        # writing a real token into a developer's login keyring when run locally. Never enabled
        # outside this E2E build.
        run: cargo build --workspace --features tauri-app/custom-protocol,tauri-app/forge-fixture-override
      - name: Install e2e dependencies
        working-directory: e2e
        run: pnpm install --frozen-lockfile
      - name: Typecheck e2e specs
        working-directory: e2e
        run: pnpm typecheck
      - name: Run E2E suite
        working-directory: e2e
        # wdio.conf.ts spawns/reaps `tauri-driver` itself around the session (the pattern from
        # the official Tauri WebdriverIO guide), so `xvfb-run` just needs to wrap the one
        # `pnpm test` command to give the whole thing (tauri-driver -> WebKitWebDriver ->
        # tauri-app) a fake display. `dbus-run-session` gives it a session bus: without one,
        # every WebDriver session start waited ~31 s on this runner (about 15 minutes per run);
        # with one it takes under a second (measured in #182; NO_AT_BRIDGE=1,
        # GTK_USE_PORTAL=0 and WEBKIT_DISABLE_COMPOSITING_MODE=1 made no difference).
        run: dbus-run-session -- xvfb-run --auto-servernum pnpm test
