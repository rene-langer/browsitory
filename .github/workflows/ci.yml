name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Cross-platform runners are reserved for pushes to main; pull requests only need
        # the Linux validation to keep feedback fast and avoid spending three runner minutes.
        os: ${{ fromJSON(github.ref == 'refs/heads/main' && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libxdo-dev build-essential
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      # The `forge-fixture-override` feature (see crates/tauri-app/Cargo.toml's doc comment)
      # gates security-sensitive code — the forge API-base-URL override and the in-memory
      # credential store swap — that only the `e2e` job below otherwise builds, and that job
      # only builds it, it never runs `cargo test`/`cargo clippy` against it. Run both here too
      # so a regression in that gated code is caught as a normal, fast `rust` job failure
      # instead of only surfacing as a confusing E2E failure.
      - name: Clippy (forge-fixture-override feature)
        run: cargo clippy -p tauri-app --features forge-fixture-override --all-targets -- -D warnings
      - name: Test (forge-fixture-override feature)
        run: cargo test -p tauri-app --features forge-fixture-override

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test -- --run

  # Builds standalone distributables on every push to main (not PRs) so a build is always
  # test-drivable without waiting for a release tag. Short-retention CI artifacts, distinct
  # from release.yml's tag-triggered draft GitHub Release, which is the permanent distribution
  # path.
  build-dist:
    if: github.ref == 'refs/heads/main'
    needs: [rust, frontend, e2e]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libxdo-dev build-essential
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Install tauri-cli
        run: cargo install tauri-cli --locked
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Build distributable (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: scripts/build-dist.sh ${{ matrix.os == 'macos-latest' && '--target universal-apple-darwin' || '' }}
      - name: Build distributable (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: scripts\build-dist.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: browsitory-dist-${{ matrix.os }}
          path: ${{ matrix.os == 'macos-latest' && 'target/universal-apple-darwin/release/bundle/' || 'target/release/bundle/' }}
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    # Fixed fixture-repo path the E2E frontend build bakes in via VITE_E2E_REPO_PATH and that
    # e2e/wdio.conf.ts's `onPrepare` hook creates before the WebDriver session starts. Must
    # match `E2E_REPO_PATH` in e2e/wdio.conf.ts (os.tmpdir() is `/tmp` on Linux runners).
    env:
      E2E_REPO_PATH: /tmp/browsitory-e2e-repo
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri + tauri-driver system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libxdo-dev build-essential \
            webkit2gtk-driver xvfb
      - uses: dtolnay/rust-toolchain@stable
      - name: Install tauri-driver
        # tauri-driver's version is independent of any other Tauri versions.
        run: cargo install tauri-driver --locked
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            e2e/pnpm-lock.yaml
      - name: Build frontend (with E2E fixture auto-open baked in)
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          VITE_E2E_REPO_PATH="$E2E_REPO_PATH" pnpm build
      - name: Build tauri-app (embedded-assets production mode)
        # Plain `cargo build` leaves Tauri's `dev` cfg true (see crates/tauri-app/Cargo.toml's
        # `custom-protocol` feature comment), which would make the binary load the Vite dev
        # server instead of the just-built frontend/dist above — fatal here, since no dev
        # server is running. `--features tauri-app/custom-protocol` embeds frontend/dist instead.
        # `tauri-app/forge-fixture-override` (also opt-in, also documented on its Cargo.toml
        # feature entry) lets `e2e/specs/pull-requests.spec.ts` redirect the GitHub/Bitbucket API
        # calls to a local fixture server instead of the real hosts, and swaps the credential
        # store `Worker::spawn` constructs to an in-memory one — this runner has no session
        # D-Bus secrets service for the real OS-keychain store to talk to, and this also avoids
        # writing a real token into a developer's login keyring when run locally. Never enabled
        # outside this E2E build.
        run: cargo build --workspace --features tauri-app/custom-protocol,tauri-app/forge-fixture-override
      - name: Install e2e dependencies
        working-directory: e2e
        run: pnpm install --frozen-lockfile
      - name: Run E2E suite
        working-directory: e2e
        # wdio.conf.ts spawns/reaps `tauri-driver` itself around the session (the pattern from
        # the official Tauri WebdriverIO guide), so `xvfb-run` just needs to wrap the one
        # `pnpm test` command to give the whole thing (tauri-driver -> WebKitWebDriver ->
        # tauri-app) a fake display.
        run: xvfb-run --auto-servernum pnpm test
