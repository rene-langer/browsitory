[package]
name = "repo-service"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
# Mirrors tauri-app's own feature of the same name (see that crate's Cargo.toml): swaps
# Worker::spawn's credential store from KeyringCredentialStore to InMemoryCredentialStore and
# lets pull_requests.rs's forge API base URLs be redirected via env vars, so an E2E build never
# touches a real OS keychain or a live GitHub/Bitbucket account. tauri-app's own flag of the
# same name forwards to this one; see that crate's Cargo.toml.
#
# NOT enabled by default, and must never be enabled in a release build: it swaps out the real
# OS-keychain-backed credential store for an in-memory one, and lets a user's real forge API
# traffic (and their saved token) be redirected via env vars to an arbitrary host. This crate is
# meant to gain more consumers over time (e.g. a future VSCode extension sidecar), each of which
# builds and enables its own features independently, so this invariant has to be carried here
# too, not just documented at tauri-app's call site: no consumer's build-time toggle should be
# able to silently redirect a user's real credentials or forge traffic.
forge-fixture-override = []
# Test-only: derives ts-rs's `TS` for the wire DTOs (`src/wire.rs`) and for the enums they
# carry (#306), so `tauri-app`'s and `vscode-sidecar`'s tests
# can generate the TypeScript of their own transport-specific DTOs, which use the shared ones.
# This crate's own tests derive it without the feature (`cfg(test)`). Only those crates'
# dev-dependencies enable it; no build of the app or the sidecar does.
ts = ["dep:ts-rs", "git-core/ts"]

[dependencies]
git-core = { path = "../git-core" }
config = { path = "../config" }
git2 = "0.21"
keyring = { version = "4.1.6", features = ["v1"] }
# `rustls-no-provider`: rustls, with certificates checked against the OS trust store
# (rustls-platform-verifier), but no crypto provider compiled in. `ReqwestForgeApi::client`
# installs ring as the process-default provider before the first client is built. reqwest's
# own `rustls` feature would pull in aws-lc-rs instead.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5"
# File system watcher for changes made outside the app (#756): inotify, FSEvents,
# ReadDirectoryChangesW. CC0-1.0, a per-crate owner exception (deny.toml, about.toml,
# docs/LICENSE_COMPLIANCE.md).
notify = "8.2"
ts-rs = { version = "12", optional = true }

[dev-dependencies]
# `TS` for the wire DTOs in this crate's own tests (the bindings test in `src/wire.rs`).
ts-rs = "12"
git-core = { path = "../git-core", features = ["ts"] }
test-support = { path = "../test-support" }
tempfile = "3"
