[package]
name = "vscode-sidecar"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "vscode-sidecar"
path = "src/main.rs"

[dependencies]
repo-service = { path = "../repo-service" }
git-core = { path = "../git-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
git2 = "0.21"
tempfile = "3"
