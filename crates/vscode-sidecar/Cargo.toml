[package]
name = "vscode-sidecar"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "vscode-sidecar"
path = "src/main.rs"

[dependencies]
repo-service = { path = "../repo-service" }
git-core = { path = "../git-core" }
config = { path = "../config" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
forge-fixture-override = ["repo-service/forge-fixture-override"]

[dev-dependencies]
ts-rs = "12"
# `ts`: the DTO binding test (#306) needs `TS` on the enums behind string wire fields.
git-core = { path = "../git-core", features = ["ts"] }
repo-service = { path = "../repo-service", features = ["ts"] }
test-support = { path = "../test-support" }
git2 = "0.21"
tempfile = "3"
