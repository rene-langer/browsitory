[package]
name = "git-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
git2 = { version = "0.21", features = ["https", "ssh", "vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0"
tempfile = "3"
unicode-normalization = "0.1.26"
url = "2.5"
ts-rs = { version = "12", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# Test-only: derives ts-rs's `TS` for the enums the wire DTOs carry (#306), so the DTO binding
# tests can generate the frontend's DTO types. Enabled by `repo-service`'s own dev-dependency
# and by its `ts` feature, which only the transports' dev-dependencies enable; no build of the
# app or the sidecar does.
ts = ["dep:ts-rs"]

[dev-dependencies]
test-support = { path = "../test-support" }
