[package]
name = "git-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
git2 = { version = "0.21", features = ["https", "ssh", "vendored-openssl"] }
thiserror = "1.0"
tempfile = "3"
unicode-normalization = "0.1.26"
url = "2.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
test-support = { path = "../test-support" }
