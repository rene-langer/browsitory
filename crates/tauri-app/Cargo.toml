[package]
name = "tauri-app"
version = "0.1.0"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
git-core = { path = "../git-core" }
config = { path = "../config" }

[dev-dependencies]
git2 = "0.21"
tempfile = "3"
