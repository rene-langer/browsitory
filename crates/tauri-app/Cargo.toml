[package]
name = "tauri-app"
version = "0.1.0"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Enables Tauri's embedded-asset production mode (serves `frontendDist` from the compiled
# binary instead of the `devUrl` dev server). Without this, `tauri`'s build.rs sets its `dev`
# cfg unconditionally true (`let dev = !custom_protocol;`), so even a `cargo build --workspace`
# debug binary would always try to load the Vite dev server at devUrl and ignore
# `frontend/dist` entirely — fatal for E2E, which must run the built binary standalone with no
# dev server running. `cargo tauri build`/`cargo tauri dev` pass this via the tauri-cli
# orchestration layer; a bare `cargo build` needs it passed explicitly, e.g.
# `cargo build --workspace --features tauri-app/custom-protocol`.
custom-protocol = ["tauri/custom-protocol"]
# Lets `crates/tauri-app/src/pull_requests.rs`'s GitHub/Bitbucket API base URLs be redirected via
# `BROWSITORY_FORGE_GITHUB_API_BASE_URL`/`BROWSITORY_FORGE_BITBUCKET_API_BASE_URL`, so
# `e2e/specs/pull-requests.spec.ts` can point the real built binary at a local loopback fixture
# server instead of the real GitHub/Bitbucket Cloud APIs. NOT enabled by default and must never
# ship in a release build: without it, the env vars are never even read (see that module's
# `github_api_base`/`bitbucket_api_base`), so nobody who can set process environment variables
# before a shipped binary launches can redirect a user's real forge traffic (and their saved
# token, sent as `Authorization: Bearer <token>`) to another host. Only the E2E build passes
# this, e.g. `cargo build --workspace --features
# tauri-app/custom-protocol,tauri-app/forge-fixture-override`.
forge-fixture-override = []

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
git-core = { path = "../git-core" }
config = { path = "../config" }
git2 = "0.21"
keyring = { version = "4.1.6", features = ["v1"] }
url = "2.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }

[dev-dependencies]
tempfile = "3"
