<!--
  Source for Browsitory's desktop app icon set. Regenerate crates/tauri-app/icons/
  with:
    cd frontend && pnpm exec tauri icon src-icon/app-icon.svg -o ../crates/tauri-app/icons
  (note: -o is the short form of the output flag; the long form contains a
  double hyphen, which is not valid inside an XML/SVG comment like this one)
  Requirements:
  - This SVG's canvas MUST be square (tauri icon refuses non-square sources).
  - The command also generates ~40 unwanted iOS/Android/Windows-Store assets
    (ios/, android/, Square*Logo.png, StoreLogo.png, 64x64.png, icon.png):
    delete everything except the 5 files crates/tauri-app/tauri.conf.json's
    bundle.icon array references (32x32.png, 128x128.png, 128x128@2x.png,
    icon.icns, icon.ico).
  - The path's raw bounding box is x: 0.104-47.619, y: 0-45.373 (48-unit
    space, no transform applied). The transform below scales it uniformly so
    the longer dimension (width) fits a 38.4x38.4 safe area (10% padding per
    side) centered in the 48x48 canvas, and centers the shorter dimension
    (height) with the resulting extra margin. Recompute both if `d` changes.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <rect width="48" height="48" rx="8" fill="#14131a"/>
  <path fill="#7c3aed" transform="translate(4.716, 5.666) scale(0.808)" d="M25.946 44.938c-.664.845-2.021.375-2.021-.698V33.937a2.26 2.26 0 0 0-2.262-2.262H10.287c-.92 0-1.456-1.04-.92-1.788l7.48-10.471c1.07-1.497 0-3.578-1.842-3.578H1.237c-.92 0-1.456-1.04-.92-1.788L10.013.474c.214-.297.556-.474.92-.474h28.894c.92 0 1.456 1.04.92 1.788l-7.48 10.471c-1.07 1.498 0 3.579 1.842 3.579h11.377c.943 0 1.473 1.088.89 1.83L25.947 44.94z"/>
</svg>
