<!--
  Source for Browsitory's desktop app icon set: an original git branch-merge glyph
  (two outer curved lanes and one straight center lane converging into a commit-node
  dot), not a downloaded asset. Colors match the design system introduced in Phase 5
  Foundation: the three lane strokes are drawn from LANE_COLORS in
  frontend/src/lib/laneColors.ts (also used by CommitLaneGraphic.tsx and
  LaneBraid.tsx), and the commit-node dot matches the light-theme
  color accent token in frontend/src/styles/tokens.css.
  Regenerate crates/tauri-app/icons/ with:
    cd frontend && pnpm exec tauri icon src-icon/app-icon.svg -o ../crates/tauri-app/icons
  (note: -o is the short form of the output flag; the long form contains a
  double hyphen, which is not valid inside an XML/SVG comment like this one)
  Requirements:
  - This SVG's canvas MUST be square (tauri icon refuses non-square sources).
  - The command also generates ~40 unwanted iOS/Android/Windows-Store assets
    (ios/, android/, Square*Logo.png, StoreLogo.png, 64x64.png, icon.png):
    delete everything except the 5 files crates/tauri-app/tauri.conf.json's
    bundle.icon array references (32x32.png, 128x128.png, 128x128@2x.png,
    icon.icns, icon.ico).
  - The three lane paths and the commit-node circle already carry built-in safe-area
    padding: path centerlines start at y=8 and run x=10 to x=38 (out of 48), but
    account for the 4px stroke width too — the actual painted margins measured on
    the rendered PNG are roughly 12.5% top, 20% bottom, 17% per side. Preserve
    real (not just centerline) margins in this range if the mark's geometry
    ever changes.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <rect width="48" height="48" rx="8" fill="#14131a"/>
  <path d="M10,8 C10,22 24,22 24,34" fill="none" stroke="#e36209" stroke-width="4" stroke-linecap="round"/>
  <path d="M24,8 L24,34" fill="none" stroke="#8250df" stroke-width="4" stroke-linecap="round"/>
  <path d="M38,8 C38,22 24,22 24,34" fill="none" stroke="#0969da" stroke-width="4" stroke-linecap="round"/>
  <circle cx="24" cy="34" r="4.5" fill="#7c3aed"/>
</svg>
